services:
  - type: web
    name: classflow-backend
    env: python
    region: singapore
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: RECORDINGS_DIR
        value: /var/data/recordings
      - key: FRONTEND_URL
        value: "*"
    disk:
      name: recordings
      mountPath: /var/data/recordings
      sizeGB: 5
